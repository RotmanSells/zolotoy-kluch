<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {

    --green: #2C3E2D;
    --green-dark: #1E2C1F;
    --green-light: #3A5039;
    --cream: #F0E8D8;
    --cream-dark: #E8DCC8;
    --warm-bg: #EDE4D2;
    --card-bg: #F5EDE0;
    --text-dark: #2A2218;
    --text-muted: #7A6E5E;
    --white: #FAF6EF;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(180,150,90,0.08) 0%, rgba(160,130,70,0.04) 40%, rgba(180,150,90,0.1) 100%),
      radial-gradient(ellipse at 20% 0%, rgba(196,162,101,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(196,162,101,0.12) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== HERO SECTION ===== */
  .hero {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 280px;
    overflow: hidden;
    z-index: 50;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background: url('4 июл. 2026 г., 11_27_21.png') center/cover;
    z-index: 0;
  }

  .hero-bg::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(transparent, var(--cream));
  }

  /* ===== MENU TABS ===== */
  .tabs-wrap {
    background: var(--cream);
    border-bottom: 1px solid rgba(196,162,101,0.15);
    padding: 0 16px;
    margin-top: 280px;
    position: relative;
    z-index: 10;
    overflow: hidden;
  }

  .tabs-wrap::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 40px;
    background: linear-gradient(90deg, transparent, var(--cream));
    pointer-events: none;
    z-index: 11;
  }

  .tabs-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 12px 0;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    max-width: 600px;
    margin: 0 auto;
    -ms-overflow-style: none;
  }

  .tabs-scroll::-webkit-scrollbar { display: none; width: 0; }

  .tab-btn {
    flex-shrink: 0;
    padding: 6px 10px;
    border: 1.5px solid var(--green);
    border-radius: 20px;
    background: transparent;
    color: var(--green);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }

  .tab-btn:hover {
    background: var(--green);
    color: var(--cream);
  }

  .tab-btn.active {
    background: var(--green);
    color: var(--cream);
    border-color: var(--green);
  }

  /* ===== MENU ===== */
  .menu-section {
    max-width: 600px;
    margin: 0 auto;
    padding: 12px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    background: var(--cream);
    z-index: 5;
  }

  .menu-section::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(90deg, rgba(180,150,90,0.12) 0%, transparent 20%, transparent 80%, rgba(180,150,90,0.12) 100%);
    pointer-events: none;
    z-index: -1;
  }

  .menu-card {
    background: var(--card-bg);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(80,60,30,0.08);
    display: flex;
    position: relative;
    min-height: 110px;
    transition: transform .2s, box-shadow .2s;
    cursor: pointer;
    border: 1px solid rgba(196,162,101,0.15);
  }

  .menu-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.1);
  }

  .menu-card-info {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    position: relative;
    z-index: 2;
  }

  .menu-card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 700;
    color: #2A2218;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }

  .menu-card-desc {
    font-size: 11px;
    font-weight: 400;
    color: #7A6E5E;
    line-height: 1.4;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .menu-card-bottom {
    display: flex;
    align-items: center;
  }

  .menu-card-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 700;
    color: #2A2218;
  }

  .menu-card-price span {
    font-size: 14px;
  }

  .menu-card-weight {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: 10px;
    font-weight: 400;
  }

  .menu-card-img {
    width: 130px;
    min-height: 110px;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 0 14px 14px 0;
  }

  .menu-card-img img {
    width: 130px;
    height: 110px;
    object-fit: cover;
    display: block;
  }

  /* ===== BOTTOM BAR ===== */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border-top: 1px solid rgba(196,162,101,0.2);
    z-index: 100;
    padding: 10px 8px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }

  .benefits-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    max-width: 600px;
    margin: 0 auto;
  }

  .benefit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .benefit-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .benefit-icon svg {
    width: 22px;
    height: 22px;
    stroke: var(--gold-dark);
    fill: none;
    stroke-width: 1.5;
  }

  .benefit-text {
    font-size: 8px;
    font-weight: 600;
    color: var(--text-dark);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    text-align: center;
    line-height: 1.2;

  @media (min-width: 600px) {
    .hero { height: 350px; }
    .tabs-wrap { margin-top: 350px; }
    .menu-card { min-height: 120px; }
    .menu-card-img { width: 160px; }

  @media (min-width: 900px) {

    .hero { height: 400px; }

let currentCat = 'recom';

function renderMenu(cat) {
  const section = document.getElementById('menuSection');
  const items = MENU.filter(m => m.cat.includes(cat));
  if (items.length === 0) {
    section.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;">Блюда скоро появятся</div>';
    return;
  }
  section.innerHTML = items.map(m => `
    <div class="menu-card">
      <div class="menu-card-info">
        <div>
          <div class="menu-card-name">${m.name}</div>
          <div class="menu-card-desc">${m.desc}</div>
        </div>
        <div class="menu-card-bottom">
          ${m.weight ? '<div class="menu-card-weight">' + m.weight + '</div>' : ''}
          <div class="menu-card-price">${m.price} <span>₽</span></div>
        </div>
      </div>
      <div class="menu-card-img">
        <img src="${m.img}" alt="${m.name}" loading="lazy">
      </div>
    </div>
  `).join('');
}

function filterCategory(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  if (btn) {
    btn.closest('.tabs-scroll').scrollTo({ left: btn.offsetLeft - 40, behavior: 'smooth' });
  }
  renderMenu(cat);
}

renderMenu('recom');
